<svg width="100%" viewBox="0 0 680 660" role="img" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>【代替/旧案・直結方式】CardputerZero ポート占有図 (CoreS3 不使用時)</title>
<desc>CoreS3 を使わない直結方式（代替/旧案）の参照図。本体の EXT(UART/SPI) と Grove(I2C) の2系統。Grove→PaHUB で I2C を 6ch 分岐し、INA226 (App13) と MLX90614/NCIR (App15) を別チャネルに割当。第一推奨は §1.6.1 の CoreS3 併用構成（cardputerzero_cores3_frontend.svg 参照）。</desc>
<style>
text{fill:#2C2C2A}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.gray{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}
.blue{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#0C447C}.blue .ts{fill:#185FA5}
.teal{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.green{fill:#EAF3DE;stroke:#3B6D11}.green .th{fill:#27500A}.green .ts{fill:#3B6D11}
.amber{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.red{fill:#FCEBEB;stroke:#A32D2D}.red .th{fill:#791F1F}.red .ts{fill:#A32D2D}
.banner{fill:#FFE9D6;stroke:#C84F00}.banner .th{fill:#7B2A00;font-weight:600}.banner .ts{fill:#9B3500}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- 直結方式 (代替/旧案) バナー -->
<g class="banner">
<rect x="40" y="14" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="33" text-anchor="middle">【代替/旧案・直結方式】 CoreS3 を使わない最小構成の参照図</text>
<text class="ts" x="340" y="49" text-anchor="middle">第一推奨は §1.6.1 CoreS3 併用構成 (cardputerzero_cores3_frontend.svg)</text>
</g>

<text class="th" x="40" y="80">CardputerZero ポート占有図 ── EXT(UART/SPI) と Grove(I2C) の2系統</text>

<g class="gray">
<rect x="40" y="94" width="600" height="120" rx="14" stroke-width="0.5"/>
<text class="th" x="58" y="118">CardputerZero 本体</text>
</g>

<g class="blue">
<rect x="62" y="132" width="270" height="68" rx="10" stroke-width="0.5"/>
<text class="th" x="197" y="156" text-anchor="middle">EXT 2.54-14P（Cap-Bus）</text>
<text class="ts" x="197" y="176" text-anchor="middle">UART G14/G15・SPI・I2C・5V</text>
<text class="ts" x="197" y="192" text-anchor="middle">上部・Cap 装着口</text>
</g>

<g class="teal">
<rect x="350" y="132" width="270" height="68" rx="10" stroke-width="0.5"/>
<text class="th" x="485" y="156" text-anchor="middle">Grove HY2.0-4P（右側面）</text>
<text class="ts" x="485" y="176" text-anchor="middle">I2C G2/G3（UARTと排他）</text>
<text class="ts" x="485" y="192" text-anchor="middle">PaHUB 接続口</text>
</g>

<line x1="197" y1="200" x2="197" y2="230" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="200" x2="485" y2="230" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="blue">
<rect x="62" y="232" width="270" height="54" rx="10" stroke-width="0.5"/>
<text class="th" x="197" y="254" text-anchor="middle">Chain Encoder ×2（UART）</text>
<text class="ts" x="197" y="273" text-anchor="middle">Cap 非装着アプリのみ・要 HY2.0 変換ハーネス</text>
</g>

<g class="teal">
<rect x="350" y="232" width="270" height="54" rx="10" stroke-width="0.5"/>
<text class="th" x="485" y="254" text-anchor="middle">PaHUB v2.1（PCA9548A 0x70）</text>
<text class="ts" x="485" y="273" text-anchor="middle">I2C を 6ch に分岐</text>
</g>

<text class="th" x="40" y="322">PaHUB チャネル割当（直結方式時）</text>

<g class="teal">
<rect x="40" y="334" width="600" height="210" rx="14" stroke-width="0.5"/>
</g>

<g class="green">
<rect x="62" y="352" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="372">CH0 → INA226-10A</text>
<text class="ts" x="76" y="390">電流/電圧測定（App13 テスター）</text>
</g>

<g class="green">
<rect x="350" y="352" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="372">CH1 → MLX90614 (NCIR・0x5A)</text>
<text class="ts" x="364" y="390">非接触温度測定（App15）</text>
</g>

<g class="gray">
<rect x="62" y="410" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="430">CH2 → 予備</text>
<text class="ts" x="76" y="448">将来 I2C センサ拡張</text>
</g>

<g class="gray">
<rect x="350" y="410" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="430">CH3 → 予備</text>
<text class="ts" x="364" y="448">将来 I2C センサ拡張</text>
</g>

<g class="gray">
<rect x="62" y="468" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="488">CH4 → 予備</text>
<text class="ts" x="76" y="506">将来 I2C センサ拡張</text>
</g>

<g class="green">
<rect x="350" y="468" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="488">CH5 → 5V/GND 給電</text>
<text class="ts" x="364" y="506">App13 パターン3 給電取出し</text>
</g>

<line x1="485" y1="286" x2="485" y2="310" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="485" y1="310" x2="340" y2="310" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="340" y1="310" x2="340" y2="332" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="amber">
<rect x="40" y="558" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="58" y="583">Cap 装着時は EXT/Grove の UART/I2C すべて Cap に占有される（Chain Encoder 直結不可・I2C は Cap 内部 GP-02 / PI4IOE5V6408 と相乗り）</text>
</g>

<g class="blue">
<rect x="40" y="606" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="58" y="631">旧 Scroll Unit ×2 構成は 2026-06-19 撤回 → 全アプリ共通の Chain Encoder ×2 (CoreS3 経由) に統一</text>
</g>
</svg>
