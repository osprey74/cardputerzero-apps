<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>CardputerZero ポート占有図 + PaHUB チャネル割当</title>
<desc>本体の EXT(UART/SPI) と Grove(I2C) の2系統。Grove→PaHUB で I2C を6ch分岐し、INA226とScroll Unitを別チャネルに割当。Cap使用時とテスター時の使い分けを示す。</desc>
<style>
text{fill:#2C2C2A}.th{font-size:14px;font-weight:500}.ts{font-size:12px;fill:#5F5E5A}
.gray{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}
.blue{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#0C447C}.blue .ts{fill:#185FA5}
.teal{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.green{fill:#EAF3DE;stroke:#3B6D11}.green .th{fill:#27500A}.green .ts{fill:#3B6D11}
.amber{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.red{fill:#FCEBEB;stroke:#A32D2D}.red .th{fill:#791F1F}.red .ts{fill:#A32D2D}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="th" x="40" y="28">CardputerZero ポート占有図 ── EXT(UART/SPI) と Grove(I2C) の2系統</text>

<g class="gray">
<rect x="40" y="42" width="600" height="120" rx="14" stroke-width="0.5"/>
<text class="th" x="58" y="66">CardputerZero 本体</text>
</g>

<g class="blue">
<rect x="62" y="80" width="270" height="68" rx="10" stroke-width="0.5"/>
<text class="th" x="197" y="104" text-anchor="middle">EXT 2.54-14P（Cap-Bus）</text>
<text class="ts" x="197" y="124" text-anchor="middle">UART G14/G15・SPI・I2C・5V</text>
<text class="ts" x="197" y="140" text-anchor="middle">上部・Cap 装着口</text>
</g>

<g class="teal">
<rect x="350" y="80" width="270" height="68" rx="10" stroke-width="0.5"/>
<text class="th" x="485" y="104" text-anchor="middle">Grove HY2.0-4P（右側面）</text>
<text class="ts" x="485" y="124" text-anchor="middle">I2C G2/G3（UARTと排他）</text>
<text class="ts" x="485" y="140" text-anchor="middle">PaHUB 接続口</text>
</g>

<line x1="197" y1="148" x2="197" y2="178" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="148" x2="485" y2="178" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="blue">
<rect x="62" y="180" width="270" height="54" rx="10" stroke-width="0.5"/>
<text class="th" x="197" y="202" text-anchor="middle">Chain Encoder ×2（UART）</text>
<text class="ts" x="197" y="221" text-anchor="middle">Cap 非装着アプリのみ（App10/11/13）</text>
</g>

<g class="teal">
<rect x="350" y="180" width="270" height="54" rx="10" stroke-width="0.5"/>
<text class="th" x="485" y="202" text-anchor="middle">PaHUB v2.1（PCA9548A 0x70）</text>
<text class="ts" x="485" y="221" text-anchor="middle">I2C を 6ch に分岐</text>
</g>

<text class="th" x="40" y="270">PaHUB チャネル割当</text>

<g class="teal">
<rect x="40" y="282" width="600" height="210" rx="14" stroke-width="0.5"/>
</g>

<g class="green">
<rect x="62" y="300" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="320">CH0 → INA226-10A</text>
<text class="ts" x="76" y="338">電流/電圧測定（App13 テスター）</text>
</g>

<g class="amber">
<rect x="350" y="300" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="320">CH1 → Unit Scroll（0x40）</text>
<text class="ts" x="364" y="338">テスター UI・値送りホイール</text>
</g>

<g class="amber">
<rect x="62" y="358" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="378">CH2 → Unit Encoder（0x40）</text>
<text class="ts" x="76" y="396">Cap 使用アプリの多ノブ UI</text>
</g>

<g class="gray">
<rect x="350" y="358" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="378">CH3 → 予備</text>
<text class="ts" x="364" y="396">将来 I2C センサ拡張</text>
</g>

<g class="gray">
<rect x="62" y="416" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="76" y="436">CH4 → 予備</text>
<text class="ts" x="76" y="454">NCIR 等の増設枠</text>
</g>

<g class="green">
<rect x="350" y="416" width="270" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="436">CH5 → 5V/GND 給電</text>
<text class="ts" x="364" y="454">App13 パターン3 給電取出し</text>
</g>

<line x1="485" y1="234" x2="485" y2="258" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="485" y1="258" x2="340" y2="258" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="340" y1="258" x2="340" y2="280" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="amber">
<rect x="40" y="506" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="58" y="531">I2C エンコーダ採用: Cap が UART/SPI を占有していても I2C(Grove→PaHUB) は独立 → Cap 併用可</text>
</g>

<g class="blue">
<rect x="40" y="554" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="58" y="579">Scroll/Encoder はともに 0x40 固定 → 同時使用時は必ず PaHUB の別チャネルに分離</text>
</g>
</svg>
