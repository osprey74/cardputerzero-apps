[package]
name = "stellar-map"
version = "0.1.0"
edition = "2021"
description = "App 16 星座盤 UI (SDL2)。サイドカーの Scene JSON を 320x170 に描く薄い front-end"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl2 = "0.37"   # ビルドに libsdl2-dev+pkg-config / 実行に libsdl2-2.0-0
libc = "0.2"    # SIGTERM/SIGINT

[[bin]]
name = "stellar-map"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
