; CardputerZero 入力フロントエンド (M5Stack CoreS3 / ESP32-S3)
; HANDOFF_cardputerzero.md §1.6.1 確定構成:
;   Port A (I2C)  : INA226-10A + MLX90614 (Hub Unit U006 で 1→3 受動分岐・同居)
;   Port C (UART) : Chain Encoder ×2 (デイジーチェーン)
;   USB CDC       : 上記を JSON 1 行に束ねて CardputerZero(USB Host/Linux) へ送信
;
; ビルド : pio run
; 書込み : pio run -t upload
; モニタ : pio device monitor

[env:m5stack-cores3]
platform  = espressif32
board     = m5stack-cores3
framework = arduino

; ESP32-S3 ネイティブ USB を CDC として使う (CardputerZero から /dev/ttyACM* で見える想定)。
; 実機で USB Host 認識を確認のこと (HANDOFF §1.6.1 末尾の注記)。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0          ; [E][Wire.cpp] 等のコアログを抑制 (スキャン出力を見やすく)

monitor_speed = 115200

; M5Unified のみを固定依存とする。INA226 / MLX90614 / Chain Encoder は
; プロトコル確定までは生 I2C/UART で読むため、専用ユニットライブラリは
; 実機検証後に lib_deps へ追加する (バージョン固定する)。
lib_deps =
    m5stack/M5Unified@^0.2.2
