; CoreS3 IMU 水準器・傾斜計 (M5Stack CoreS3 / ESP32-S3) ― 単体アプリ
; 内蔵 6 軸 IMU (BMI270) の加速度から傾き角を求め、気泡水準器/傾斜計として表示する。
; CardputerZero フロントエンド (../cores3-frontend) とは独立した自己完結アプリ。
;
; ビルド : pio run
; 書込み : pio run -t upload   (CoreS3 を USB-C 接続・既定 COM5)
; モニタ : pio device monitor  (軸の向き検証用に {"log":"imu",...} を出力)

[env:m5stack-cores3]
platform  = espressif32
board     = m5stack-cores3
framework = arduino

; ESP32-S3 ネイティブ USB を CDC として使う (軸検証ログのモニタ用)。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200

; 内蔵 IMU・液晶・タッチ・電源は M5Unified で完結する (追加ライブラリ不要)。
lib_deps =
    m5stack/M5Unified@^0.2.2
