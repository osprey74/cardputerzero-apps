; CoreS3 セミナー・カウントダウンタイマー (M5Stack CoreS3 / ESP32-S3) ― 単体アプリ
; プリセット時間 (90/120 分など) を選び、円グラフ (ドーナツ) が時計回りに減少していく。
; 中央に残り時間 (大) と経過時間 (小) を併記する。0 到達後は超過時間をカウントアップ。
; CardputerZero フロントエンド (../cores3-frontend) とは独立した自己完結アプリ。
;
; ビルド : pio run
; 書込み : pio run -t upload   (CoreS3 を USB-C 接続・既定 COM5)
; モニタ : pio device monitor

[env:m5stack-cores3]
platform  = espressif32
board     = m5stack-cores3
framework = arduino

; ESP32-S3 ネイティブ USB を CDC として使う (状態ログのモニタ用)。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200

; 液晶・タッチ・電源・NVS(Preferences) は M5Unified + Arduino コアで完結する。
lib_deps =
    m5stack/M5Unified@^0.2.2
